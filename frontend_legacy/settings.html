<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityWatch | System Settings</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .settings-layout {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.75rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                CITYWATCH
                <span>// TRAFFIC SURVEILLANCE</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html" class="nav-item">Live Dashboard</a>
            <a href="video_analysis.html" class="nav-item">Video Analysis</a>
            <a href="settings.html" class="nav-item active">System Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="page-title">System Configurations</div>
        </header>

        <div class="settings-layout">
            <div class="panel">
                <div class="panel-header">MODEL WEIGHTS & HYPERPARAMETERS</div>
                <div style="padding: 1.5rem;">
                    <div class="form-group">
                        <label>YOLO Model Path</label>
                        <input type="text" id="inputYoloPath" class="form-control" value="weights/yolov8n.pt">
                    </div>
                    <div class="form-group">
                        <label>Detection Confidence Threshold</label>
                        <input type="number" id="inputConfThresh" class="form-control" value="0.25" step="0.05">
                    </div>
                    <div class="form-group">
                        <label>DeepSORT Max Age</label>
                        <input type="number" id="inputMaxAge" class="form-control" value="30">
                    </div>
                    <button class="btn" onclick="saveConfig()">Save Configuration</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">CAMERA SOURCES</div>
                <div style="padding: 1.5rem;">
                    <div class="form-group">
                        <label>Camera 01 (Main Feed) RTSP URL</label>
                        <input type="text" id="inputCam1" class="form-control" value="rtsp://krpuram.local/stream1">
                    </div>
                    <div class="form-group">
                        <label>Camera 02 RTSP URL</label>
                        <input type="text" id="inputCam2" class="form-control" value="rtsp://krpuram.local/stream2">
                    </div>
                    <button class="btn" style="background: var(--bg-base); border: 1px solid var(--border-color); margin-top: 1rem;">+ Add Camera</button>
                </div>
            </div>

            <div class="panel" style="grid-column: span 2;">
                <div class="panel-header">RATG-OC ADAPTIVE SCHEDULING (RESEARCH PAPER CONFIGURATION)</div>
                <div style="padding: 1.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label>RATG Adaptive Gating</label>
                        <select id="inputRatgEnabled" class="form-control">
                            <option value="true">Enabled (Adaptive Mode)</option>
                            <option value="false">Disabled (Full Fixed-Rate Baseline)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Risk Threshold (&tau;<sub>D</sub>)</label>
                        <input type="number" id="inputTauD" class="form-control" value="0.5" step="0.05" min="0.1" max="1.0">
                    </div>
                    <div class="form-group">
                        <label>Boundary Proximity Override (&tau;<sub>Z</sub>)</label>
                        <input type="number" id="inputTauZ" class="form-control" value="0.7" step="0.05" min="0.1" max="1.0">
                    </div>
                    <div class="form-group">
                        <label>Max Propagate Frames (K<sub>max</sub>)</label>
                        <input type="number" id="inputKMax" class="form-control" value="4" min="1" max="12">
                    </div>
                    <div class="form-group">
                        <label>Laplacian Blur Threshold (&tau;<sub>L</sub>)</label>
                        <input type="number" id="inputTauL" class="form-control" value="100.0" step="10.0">
                    </div>
                    <div class="form-group">
                        <label>Consensus Weight Threshold (&tau;<sub>C</sub>)</label>
                        <input type="number" id="inputTauC" class="form-control" value="2.0" step="0.2" min="0.5">
                    </div>
                    <div class="form-group">
                        <label>Stability Margin (m)</label>
                        <input type="number" id="inputStabilityMargin" class="form-control" value="0.5" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Voting Buffer Limit (B)</label>
                        <input type="number" id="inputCacheLimit" class="form-control" value="10" min="2" max="30">
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button class="btn" style="width: 100%;" onclick="saveConfig()">Save All Settings</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    async function loadConfig() {
        try {
            const res = await fetch('/api/config');
            if (!res.ok) return;
            const cfg = await res.json();
            
            if (cfg.model) {
                document.getElementById('inputYoloPath').value = cfg.model.yolo_weights || 'weights/yolov8n.pt';
                document.getElementById('inputConfThresh').value = cfg.model.confidence_threshold || 0.25;
            }
            if (cfg.tracker) {
                document.getElementById('inputMaxAge').value = cfg.tracker.max_age || 30;
            }
            if (cfg.camera && cfg.camera.sources) {
                if (cfg.camera.sources[0]) document.getElementById('inputCam1').value = cfg.camera.sources[0];
                if (cfg.camera.sources[1]) document.getElementById('inputCam2').value = cfg.camera.sources[1];
            }
            if (cfg.ratg_oc) {
                document.getElementById('inputRatgEnabled').value = cfg.ratg_oc.enabled !== false ? 'true' : 'false';
                document.getElementById('inputTauD').value = cfg.ratg_oc.tau_d ?? 0.5;
                document.getElementById('inputTauZ').value = cfg.ratg_oc.tau_z ?? 0.7;
                document.getElementById('inputKMax').value = cfg.ratg_oc.k_max ?? 4;
                document.getElementById('inputTauL').value = cfg.ratg_oc.tau_l ?? 100.0;
                document.getElementById('inputTauC').value = cfg.ratg_oc.tau_c ?? 2.0;
                document.getElementById('inputStabilityMargin').value = cfg.ratg_oc.stability_margin ?? 0.5;
                document.getElementById('inputCacheLimit').value = cfg.ratg_oc.cache_limit ?? 10;
            }
        } catch (err) {
            console.error('Error loading configuration:', err);
        }
    }

    async function saveConfig() {
        const payload = {
            model: {
                yolo_weights: document.getElementById('inputYoloPath').value,
                confidence_threshold: parseFloat(document.getElementById('inputConfThresh').value) || 0.25,
                iou_threshold: 0.45,
                classes: [2, 3, 5, 7]
            },
            tracker: {
                max_age: parseInt(document.getElementById('inputMaxAge').value) || 30,
                n_init: 3,
                nn_budget: 100
            },
            camera: {
                sources: [
                    document.getElementById('inputCam1').value,
                    document.getElementById('inputCam2').value
                ],
                fps: 30
            },
            ratg_oc: {
                enabled: document.getElementById('inputRatgEnabled').value === 'true',
                tau_d: parseFloat(document.getElementById('inputTauD').value) || 0.5,
                tau_z: parseFloat(document.getElementById('inputTauZ').value) || 0.7,
                k_max: parseInt(document.getElementById('inputKMax').value) || 4,
                tau_l: parseFloat(document.getElementById('inputTauL').value) || 100.0,
                tau_c: parseFloat(document.getElementById('inputTauC').value) || 2.0,
                stability_margin: parseFloat(document.getElementById('inputStabilityMargin').value) || 0.5,
                cache_limit: parseInt(document.getElementById('inputCacheLimit').value) || 10
            }
        };

        try {
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('Configuration saved successfully to backend (configs/default.yaml)!');
            } else {
                alert('Error saving configuration.');
            }
        } catch (err) {
            console.error('Error saving config:', err);
            alert('Failed to connect to backend server.');
        }
    }

    window.onload = loadConfig;
</script>
</body>
</html>
