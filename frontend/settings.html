<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityWatch | System Settings</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .settings-layout {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.75rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                CITYWATCH
                <span>// TRAFFIC SURVEILLANCE</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html" class="nav-item">Live Dashboard</a>
            <a href="video_analysis.html" class="nav-item">Video Analysis</a>
            <a href="settings.html" class="nav-item active">System Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="page-title">System Configurations</div>
        </header>

        <div class="settings-layout">
            <div class="panel">
                <div class="panel-header">MODEL WEIGHTS & HYPERPARAMETERS</div>
                <div style="padding: 1.5rem;">
                    <div class="form-group">
                        <label>YOLO Model Path</label>
                        <input type="text" class="form-control" value="weights/yolov8n.pt">
                    </div>
                    <div class="form-group">
                        <label>Detection Confidence Threshold</label>
                        <input type="number" class="form-control" value="0.5" step="0.05">
                    </div>
                    <div class="form-group">
                        <label>DeepSORT Max Age</label>
                        <input type="number" class="form-control" value="30">
                    </div>
                    <button class="btn" onclick="alert('Settings saved. Restart required.')">Save Configuration</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">CAMERA SOURCES</div>
                <div style="padding: 1.5rem;">
                    <div class="form-group">
                        <label>Camera 01 (Main Feed) RTSP URL</label>
                        <input type="text" class="form-control" value="rtsp://krpuram.local/stream1">
                    </div>
                    <div class="form-group">
                        <label>Camera 02 RTSP URL</label>
                        <input type="text" class="form-control" value="rtsp://krpuram.local/stream2">
                    </div>
                    <button class="btn" style="background: var(--bg-base); border: 1px solid var(--border-color); margin-top: 1rem;">+ Add Camera</button>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
