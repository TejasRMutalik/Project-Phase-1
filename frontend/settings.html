<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityWatch | System Settings</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .settings-layout {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.75rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                CITYWATCH
                <span>// TRAFFIC SURVEILLANCE</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html" class="nav-item">Live Dashboard</a>
            <a href="video_analysis.html" class="nav-item">Video Analysis</a>
            <a href="settings.html" class="nav-item active">System Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="page-title">System Configurations</div>
        </header>

        <div class="settings-layout">
            <div class="panel">
                <div class="panel-header">MODEL WEIGHTS & HYPERPARAMETERS</div>
                <div style="padding: 1.5rem;">
                    <div class="form-group">
                        <label>YOLO Model Path</label>
                        <input type="text" id="inputYoloPath" class="form-control" value="weights/yolov8n.pt">
                    </div>
                    <div class="form-group">
                        <label>Detection Confidence Threshold</label>
                        <input type="number" id="inputConfThresh" class="form-control" value="0.25" step="0.05">
                    </div>
                    <div class="form-group">
                        <label>DeepSORT Max Age</label>
                        <input type="number" id="inputMaxAge" class="form-control" value="30">
                    </div>
                    <button class="btn" onclick="saveConfig()">Save Configuration</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">CAMERA SOURCES</div>
                <div style="padding: 1.5rem;">
                    <div class="form-group">
                        <label>Camera 01 (Main Feed) RTSP URL</label>
                        <input type="text" id="inputCam1" class="form-control" value="rtsp://krpuram.local/stream1">
                    </div>
                    <div class="form-group">
                        <label>Camera 02 RTSP URL</label>
                        <input type="text" id="inputCam2" class="form-control" value="rtsp://krpuram.local/stream2">
                    </div>
                    <button class="btn" style="background: var(--bg-base); border: 1px solid var(--border-color); margin-top: 1rem;">+ Add Camera</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    async function loadConfig() {
        try {
            const res = await fetch('/api/config');
            if (!res.ok) return;
            const cfg = await res.json();
            
            if (cfg.model) {
                document.getElementById('inputYoloPath').value = cfg.model.yolo_weights || 'weights/yolov8n.pt';
                document.getElementById('inputConfThresh').value = cfg.model.confidence_threshold || 0.25;
            }
            if (cfg.tracker) {
                document.getElementById('inputMaxAge').value = cfg.tracker.max_age || 30;
            }
            if (cfg.camera && cfg.camera.sources) {
                if (cfg.camera.sources[0]) document.getElementById('inputCam1').value = cfg.camera.sources[0];
                if (cfg.camera.sources[1]) document.getElementById('inputCam2').value = cfg.camera.sources[1];
            }
        } catch (err) {
            console.error('Error loading configuration:', err);
        }
    }

    async function saveConfig() {
        const payload = {
            model: {
                yolo_weights: document.getElementById('inputYoloPath').value,
                confidence_threshold: parseFloat(document.getElementById('inputConfThresh').value) || 0.25,
                iou_threshold: 0.45,
                classes: [2, 3, 5, 7]
            },
            tracker: {
                max_age: parseInt(document.getElementById('inputMaxAge').value) || 30,
                n_init: 2,
                nn_budget: 100
            },
            camera: {
                sources: [
                    document.getElementById('inputCam1').value,
                    document.getElementById('inputCam2').value
                ],
                fps: 30
            }
        };

        try {
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('Configuration saved successfully to backend (configs/default.yaml)!');
            } else {
                alert('Error saving configuration.');
            }
        } catch (err) {
            console.error('Error saving config:', err);
            alert('Failed to connect to backend server.');
        }
    }

    window.onload = loadConfig;
</script>
</body>
</html>
